<link rel="preload" href="fonts/vz-ar-400.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face{font-family:Vz;font-weight:400;font-display:swap;src:url(fonts/vz-ar-400.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vz;font-weight:600;font-display:swap;src:url(fonts/vz-ar-600.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vz;font-weight:800;font-display:swap;src:url(fonts/vz-ar-800.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+200C-200F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Vz;font-weight:400;font-display:swap;src:url(fonts/vz-la-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212}
@font-face{font-family:Vz;font-weight:600;font-display:swap;src:url(fonts/vz-la-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212}
@font-face{font-family:Vz;font-weight:800;font-display:swap;src:url(fonts/vz-la-800.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212}

/* Silver day / deep-green night. Brand: green #1b3f33, cream #e1cfb4, copper #9b6144, silver logo. */
:root{
  --bg:#edf0ee; --surface:#ffffff; --raised:#f6f8f7; --ink:#14302a; --muted:#66766f; --line:rgba(20,48,42,.12);
  --brand:#1b3f33; --brand-ink:#eef1f0; --accent:#9b6144; --accent-ink:#fff; --soft:#e5ebe8; --sel:#1b3f33; --sel-ink:#f2f4f3;
  --ok:#2f7d5b; --warn:#a76512; --err:#b4483c; --glass:rgba(250,251,250,.72); --shadow:0 10px 30px rgba(20,48,42,.10);
  --r:18px; --r-s:12px; --nav:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c1c17; --surface:#132a23; --raised:#18332b; --ink:#e9eeec; --muted:#97aaa2; --line:rgba(233,238,236,.10);
  --brand:#173a30; --brand-ink:#eef1f0; --accent:#c4835f; --accent-ink:#1a120d; --soft:#1c3a31; --sel:#e1cfb4; --sel-ink:#16302a;
  --ok:#5fbf91; --warn:#e2a24b; --err:#e57a6c; --glass:rgba(16,36,30,.72); --shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme=dark]{
  --bg:#0c1c17; --surface:#132a23; --raised:#18332b; --ink:#e9eeec; --muted:#97aaa2; --line:rgba(233,238,236,.10);
  --brand:#173a30; --brand-ink:#eef1f0; --accent:#c4835f; --accent-ink:#1a120d; --soft:#1c3a31; --sel:#e1cfb4; --sel-ink:#16302a;
  --ok:#5fbf91; --warn:#e2a24b; --err:#e57a6c; --glass:rgba(16,36,30,.72); --shadow:0 10px 30px rgba(0,0,0,.35);
}
html{--w:680px}
@media (min-width:1000px){html{--w:1120px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Vz,Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* header: the one memorable thing — the silver logotype on the brand green */
header{background:var(--brand);color:var(--brand-ink);padding:calc(max(env(safe-area-inset-top),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 14px) 16px 22px;position:relative;overflow:hidden}
header .row{max-width:var(--w);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:42px;width:auto;display:block}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.18) 48%,transparent 60%);transform:translateX(120%);pointer-events:none}
.loaded .sheen{animation:sheen 1.6s .2s ease-out 1 both}
@keyframes sheen{to{transform:translateX(-120%)}}
@media (prefers-reduced-motion:reduce){.loaded .sheen{animation:none}}
.who{display:flex;align-items:center;gap:8px;border:1px solid rgba(238,241,240,.22);background:rgba(238,241,240,.06);border-radius:999px;padding:5px 6px 5px 12px;color:var(--brand-ink);font-size:13px}
.who b{font-weight:600}
.who i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(238,241,240,.14);font-size:13px;overflow:hidden}
.who i img,.av img,.avbig img{width:100%;height:100%;object-fit:cover;display:block}
.avrow{display:flex;align-items:center;gap:14px}
.avbig{width:76px;height:76px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:28px;font-weight:800;overflow:hidden;flex:none;border:2px solid var(--line)}
.avrow .btns{display:flex;flex-wrap:wrap;gap:8px}
.avrow label.btn{position:relative;overflow:hidden}
.avrow label.btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sub{max-width:var(--w);margin:6px auto 0;font-size:13px;opacity:.78}

main{max-width:var(--w);margin:0 auto;padding:16px 16px calc(var(--nav) + 120px)}
h2{font-size:19px;font-weight:800;margin:6px 0 2px;letter-spacing:-.2px}
h3{font-size:15px;font-weight:600;margin:0}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.group{background:var(--surface);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.group>.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.hint{color:var(--muted);font-size:12.5px}
.err{color:var(--err)}

/* photo */
.drop{display:grid;place-items:center;text-align:center;min-height:190px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--raised);position:relative;overflow:hidden}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--raised)}
.drop .ph{padding:18px;color:var(--muted)}
.drop .ph strong{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .x{position:absolute;top:10px;left:10px;z-index:2;border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;padding:4px 12px;font-size:12.5px}

/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed=true]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chip[disabled]{opacity:.42;cursor:not-allowed}
.chip .lk{font-size:11px}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button[disabled]{opacity:.4}

/* fields */
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.in{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:var(--r-s);padding:10px 12px;outline:none;transition:border-color .15s}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:84px;resize:vertical;line-height:1.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.unit{position:relative}
.unit .in{padding-left:44px;direction:ltr;text-align:right}
.unit em{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:12.5px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw > span{display:flex;flex-direction:column;gap:2px}
.sw small.d{font-size:12.5px;color:var(--muted);line-height:1.6}
.okc{color:var(--ok)!important}.offc{color:var(--muted)!important;font-weight:600}
.aimain{border:1.5px solid var(--line)}.aimain.on{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.aimain .sw b{font-size:16px}
.tg:disabled{opacity:.35}
#aiTestOut{margin:0 0 6px;font-size:13.5px;line-height:1.8}
.tg{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tg:checked{background:var(--ok)}.tg:checked::after{transform:translateX(-18px)}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--sel);color:var(--sel-ink)}
.btn.danger{background:transparent;color:var(--err);border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* SKU preview + action bar */
.sku{direction:ltr;text-align:left;font-weight:800;letter-spacing:.4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sku small{color:var(--muted);font-weight:600}
.dock{position:fixed;inset:auto 0 calc(var(--nav) + env(safe-area-inset-bottom));z-index:20;padding:10px 16px}
.dock .in-dock{max-width:var(--w);margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:10px 10px 10px 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.dock .meta{flex:1;min-width:0}
.dock .meta .hint{display:block;line-height:1.4}

/* glass bottom navigation */
nav.tabs{position:fixed;inset:auto 0 0;z-index:30;background:var(--glass);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){html:not(.lite) nav.tabs{backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}}
html.lite nav.tabs{background:var(--surface)}
nav.tabs .in-nav{max-width:var(--w);margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav)}
nav.tabs button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--ink)}
nav.tabs button[aria-current=page] svg{stroke:var(--accent)}

/* products */
.toolbar{display:flex;gap:8px;margin:8px 0 4px}
.toolbar .in{flex:1}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.pc{background:var(--surface);border-radius:var(--r);overflow:hidden;border:0;padding:0;text-align:right;box-shadow:var(--shadow);display:flex;flex-direction:column}
.pc .th{aspect-ratio:1;background:var(--raised);display:grid;place-items:center;color:var(--muted);font-size:12.5px;overflow:hidden;position:relative}
.pc .th img{width:100%;height:100%;object-fit:cover}
.pc .b{padding:9px 11px 11px}
.pc .s{direction:ltr;text-align:left;font-weight:700;font-size:12.5px;letter-spacing:.3px;word-break:break-all;line-height:1.5}
.pc .c{font-size:12.5px;color:var(--muted)}
.badge{position:absolute;top:8px;right:8px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--surface);color:var(--ink)}
.badge.ready{color:var(--ok)}.badge.processing{color:var(--warn)}.badge.failed{color:var(--err)}.badge.published{background:var(--ok);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,15,12,.48);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 10px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:2}
.x0{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.im{position:relative;border-radius:var(--r-s);overflow:hidden;background:var(--raised);aspect-ratio:1;border:0;padding:0}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im .k{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:1px 9px;font-size:11.5px}
.im .del{position:absolute;top:6px;left:6px;border:0;border-radius:50%;width:28px;height:28px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs .im{aspect-ratio:1}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r-s);aspect-ratio:1;color:var(--muted);font-size:13px;display:grid;place-items:center;position:relative;overflow:hidden}
.add input{position:absolute;inset:0;opacity:0}
.spec{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.spec:last-child{border-bottom:0}
.spec span{color:var(--muted);font-size:13.5px}
.spec b{font-weight:600}
.spec .v{display:flex;align-items:center;gap:8px}
.cp{border:0;background:var(--soft);border-radius:8px;padding:3px 9px;font-size:12px}
.light{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center}
.light img{max-width:100vw;max-height:100vh;object-fit:contain}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:right}
.list .li:last-child{border-bottom:0}
.list .li .t{flex:1;min-width:0}
.list .li .t small{display:block;color:var(--muted);font-size:12.5px}
.av{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.stat{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.stat.off{background:var(--muted)}
details.pr{border-bottom:1px solid var(--line);padding:10px 0}
details.pr summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.pr summary::after{content:'+';color:var(--muted)}
details.pr[open] summary::after{content:'–'}
.mock{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--ink);border-radius:var(--r-s);padding:10px 12px;font-size:13px;margin-top:12px}
.quota{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.quota b{color:var(--ink)}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 90px);transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100vw - 32px);transition:all .2s;pointer-events:none;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-left-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{height:180px;border-radius:var(--r);background:linear-gradient(90deg,var(--raised),var(--soft),var(--raised));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.login{max-width:380px;margin:20px auto}
.fs{border:1px solid rgba(238,241,240,.22);background:rgba(238,241,240,.06);color:var(--brand-ink);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;padding:0}
.fs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.hrt{display:flex;align-items:center;gap:8px}
@media (min-width:1000px){.cform{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:0 24px;align-items:start}.cform>.g-photo{grid-row:span 30;position:sticky;top:16px}.cform>.group{margin-top:0;margin-bottom:14px}.cform{margin-top:14px}.g-photo .drop{min-height:360px}}
@media (min-width:720px){main{padding-top:24px}.plist{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d9dde1"/><stop offset=".55" stop-color="#f4f6f7"/><stop offset=".8" stop-color="#b8bec4"/><stop offset="1" stop-color="#eef0f2"/>
    </linearGradient>
  </defs>
  <symbol id="logo" viewBox="0 0 1004.83 388.44"><g fill="url(#silver)">%%LOGO%%</g></symbol>
</svg>
<header>
  <div class="sheen"></div>
  <div class="row">
    <svg class="logo" viewBox="0 0 1004.83 388.44" role="img" aria-label="نقرینو"><use href="#logo"/></svg>
    <div class="hrt"><button class="fs hidden" id="fs" data-a="fullscreen" aria-label="تمام‌صفحه"></button><button class="who hidden" id="who" data-a="account"></button></div>
  </div>
  <div class="sub" id="sub">استودیو عکاسی محصول</div>
</header>
<main id="view"><div class="skel"></div></main>
<div class="dock hidden" id="dock"></div>
<nav class="tabs hidden" id="nav"><div class="in-nav" id="navin"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const qs = new URLSearchParams(location.search);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const FALLBACK_API = 'https://62417.sevenhost.cloud/webhook/nqs-api';
const API = qs.get('api') || store.get('api') || FALLBACK_API;
store.set('api', API);
const $ = (s, r = document) => r.querySelector(s);

function applyTheme() {
  const pick = store.get('theme');
  const auto = (tg && tg.colorScheme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = pick || auto;

}
// weak phones skip the blur
if ((navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || matchMedia('(prefers-reduced-transparency: reduce)').matches) document.documentElement.classList.add('lite');
applyTheme();

// ---- fullscreen (Telegram 8.0+): automatic on desktop, toggle button everywhere ----
const DESKTOP = tg && /^(tdesktop|macos|web|weba|webk|unigram)$/.test(tg.platform || '');
const fsOK = () => !!(tg && tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0'));
const FS_ICON = { on: '<svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>', off: '<svg viewBox="0 0 24 24"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>' };
function fsButton() { const b = $('#fs'); if (!b) return; b.classList.toggle('hidden', !fsOK()); const on = !!(tg && tg.isFullscreen); b.innerHTML = on ? FS_ICON.off : FS_ICON.on; b.setAttribute('aria-label', on ? 'خروج از تمام‌صفحه' : 'تمام‌صفحه'); }
function toggleFullscreen() {
  if (!fsOK()) return;
  try { if (tg.isFullscreen) { tg.exitFullscreen(); store.set('fs', 'off'); } else { tg.requestFullscreen(); store.set('fs', 'on'); } } catch (e) {}
}
if (fsOK()) {

// ---- server ----
class NeedLogin extends Error {}
async function api(action, data = {}, files = []) {
  const fd = new FormData();
  fd.append('initData', (tg && tg.initData) || '');
  fd.append('action', action);
  for (const k of ['sku', 'q', 'status']) if (data[k] !== undefined) fd.append(k, data[k]);
  fd.append('payload', JSON.stringify(data));
  files.forEach((f, i) => fd.append('file' + i, f, f.name || `photo${i}.jpg`));
  let res;
  try { res = await fetch(API, { method: 'POST', body: fd }); }
  catch (e) { throw new Error('اتصال به سرور برقرار نشد. اینترنت را بررسی کنید.'); }
  const j = await res.json().catch(() => ({}));
  if (j && j.needLogin && action !== 'login') { S.cfg = null; render(); throw new NeedLogin(j.error || ''); }
  if (!res.ok || j.ok === false) throw new Error(j.error || `خطای سرور (${res.status})`);
  return j;
}
function toast(msg, ms = 2800) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
const fail = e => { if (!(e instanceof NeedLogin)) toast(e.message, 5000); };
async function shrink(file, max = 2560) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 5e6 && /jpe?g|png|webp/.test(file.type)) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.93));
    return new File([blob], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  haptic(); toast('کپی شد');
}
function download(url, name) {
  if (!url) return;
  try { if (tg && tg.downloadFile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) return tg.downloadFile({ url, file_name: name || 'noqrino.png' }); } catch (e) {}
  if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank');
}

async function squareJpeg(file, size = 192) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return c.toDataURL('image/jpeg', 0.82);
}

  $('#nav').classList.toggle('hidden', tabs.length < 2);
  $('#navin').innerHTML = tabs.map(t => `<button data-a="tab" data-v="${t.id}" ${t.id === S.tab ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24">${t.icon}</svg>${t.fa}</button>`).join('');

    <label class="f"><span>نقش</span><select class="in" id="ue-r">${roles.map(r => `<option value="${esc(r.id)}" ${u && u.role === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
    <div class="sw"><span>فعال</span><input type="checkbox" class="tg" id="ue-a" ${!u || u.active ? 'checked' : ''}></div>
    ${u && u.linked ? `<div class="sw"><span>جدا کردن از تلگرام فعلی</span><input type="checkbox" class="tg" id="ue-x"></div>` : ''}
    <button class="btn pri block" style="margin-top:10px" data-a="userSave">ذخیره و کپی اطلاعات ورود</button>
    ${u ? `<button class="btn danger block" style="margin-top:8px" data-a="userDel" data-u="${esc(u.username)}">حذف کاربر</button>` : ''}</div>`;
}
function roleSheet(r) {
  const pl = S.cfg.permList || [];
  const qv = v => (v == null || v < 0) ? '' : v;
  return `<div class="sh"><h2>${r ? esc(r.name) : 'نقش جدید'}</h2><button class="x0" data-a="close" aria-label="بستن">×</button></div>
  <div class="group"><label class="f"><span>نام نقش</span><input class="in" id="re-n" value="${esc(r ? r.name : '')}"></label>
    <div class="gh" style="margin-top:12px"><h3>دسترسی‌ها</h3></div>
    ${pl.map(p => `<div class="sw"><span>${esc(p.label)}</span><input type="checkbox" class="tg re-p" data-k="${p.key}" ${r && r.perms[p.key] ? 'checked' : ''}></div>`).join('')}</div>
  <div class="group"><div class="gh"><h3>سقف ساخت عکس</h3><span class="hint">خالی = نامحدود؛ تولید دوباره هم حساب می‌شود</span></div>
    <div class="grid2"><label class="f"><span>روزانه</span><input class="in" id="re-d" inputmode="numeric" placeholder="∞" value="${qv(r && r.quota_day)}"></label>
    <label class="f"><span>ماهانه</span><input class="in" id="re-m" inputmode="numeric" placeholder="∞" value="${qv(r && r.quota_month)}"></label></div>
    <button class="btn pri block" data-a="roleSave" data-id="${esc(r ? r.id : '')}">ذخیره نقش</button>
    ${r ? `<button class="btn danger block" style="margin-top:8px" data-a="roleDel" data-id="${esc(r.id)}">حذف نقش</button>` : ''}</div>`;
}
function accountSheet() {
  const me = S.cfg.me, q = me.quota;
  const bar = x => x.limit < 0 ? `<span class="hint">نامحدود · ${faNum(x.used)} عکس</span>` : `<span class="hint">${faNum(x.used)} از ${faNum(x.limit)}</span><div class="meter"><i style="width:${Math.min(100, x.used / Math.max(1, x.limit) * 100)}%"></i></div>`;
  const th = store.get('theme') || '';
  return `<div class="sh"><h2>${esc(me.name)}</h2><button class="x0" data-a="close" aria-label="بستن">×</button></div>
  <div class="group"><div class="avrow"><div class="avbig" id="avbig">${avHtml(avatarOf(me), me.name)}</div>
    <div><h3>عکس پروفایل</h3><span class="hint">${me.avatar ? 'عکس انتخابی شما' : tgPhoto() ? 'فعلا عکس تلگرام شما نمایش داده می‌شود' : 'هنوز عکسی انتخاب نشده'}</span>
    <div class="btns" style="margin-top:8px"><label class="btn sm dark">انتخاب عکس<input type="file" accept="image/*" data-a="avatarPick" aria-label="انتخاب عکس پروفایل"></label>
    ${me.avatar ? '<button class="btn sm" data-a="avatarDel">حذف</button>' : ''}</div></div></div></div>
  <div class="group"><div class="spec"><span>نقش</span><b>${esc(me.role)}</b></div>${me.username ? `<div class="spec"><span>نام کاربری</span><b dir="ltr">${esc(me.username)}</b></div>` : ''}</div>
  ${me.perms.generate ? `<div class="group"><div class="gh"><h3>عکس‌های امروز</h3></div>${bar(q.day)}<div class="gh" style="margin-top:12px"><h3>عکس‌های این ماه</h3></div>${bar(q.month)}</div>` : ''}
  <div class="group"><div class="gh"><h3>ظاهر</h3></div><div class="seg">${[['', 'خودکار'], ['light', 'روز'], ['dark', 'شب']].map(([k, t]) => `<button data-a="theme" data-v="${k}" aria-pressed="${th === k}">${t}</button>`).join('')}</div></div>
  ${me.owner ? '' : `<button class="btn danger block" data-a="logout">خروج از حساب</button>`}`;
}

// ---------- sheet & lightbox ----------
function openSheet(html) {
  const l = $('#layer');
  l.innerHTML = `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody">${html}</div></div></div>`;
  document.body.style.overflow = 'hidden';
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
}
function closeSheet() {
  $('#layer').innerHTML = ''; document.body.style.overflow = '';
  if (tg && tg.BackButton) { tg.BackButton.offClick(closeSheet); tg.BackButton.hide(); }
}
const sheetOpen = () => !!$('#sheetBody');
function zoom(u) {
  const d = document.createElement('div'); d.className = 'light'; d.innerHTML = `<img src="${esc(u)}" alt="">`;
  d.onclick = () => d.remove(); document.body.appendChild(d);
}

// ---------- actions ----------
async function busy(btn, fn) {
  if (btn) { btn.disabled = true; btn._t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); } catch (e) { fail(e); } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = btn._t; } }
}
const val = id => { const e = $('#' + id); return e ? e.value.trim() : ''; };
const A = {
  tab(el) { S.tab = el.dataset.v; haptic(); window.scrollTo(0, 0); render(); },
  account() { openSheet(accountSheet()); },
  fullscreen() { haptic(); toggleFullscreen(); },
  theme(el) { store.set('theme', el.dataset.v); applyTheme(); $('#sheetBody').innerHTML = accountSheet(); },
  async logout(el) { if (!await ask('از حساب خارج می‌شوید؟')) return; await busy(el, async () => { await api('logout'); closeSheet(); S.cfg = null; render(); }); },
  async login(el) {
    const username = val('lg-u'), password = $('#lg-p').value;
    if (!username || !password) return;
    await busy(el, async () => {
      try { S.cfg = await api('login', { username, password }); haptic('medium'); render(); }
      catch (e) { const er = $('#lg-e'); if (er) { er.textContent = e.message; er.classList.remove('hidden'); } }
    });
  },
  async photo(el) {
    const f = el.files && el.files[0]; if (!f) return;
    S.f.file = await shrink(f); if (S.f.url) URL.revokeObjectURL(S.f.url); S.f.url = URL.createObjectURL(S.f.file); render();
  },
  clearPhoto() { S.f.file = null; if (S.f.url) URL.revokeObjectURL(S.f.url); S.f.url = ''; render(); },
  set(el) { S.f[el.dataset.k] = el.dataset.v; haptic(); render(); },
  cat(el) {
    S.f.cat = el.dataset.v; const m = modesFor(curCat());
    if (!m[S.f.mode]) S.f.mode = m.industrial ? 'industrial' : m.modeling ? 'modeling' : '';
    S.f.dims = {}; haptic(); render();
  },
  mode(el) { S.f.mode = el.dataset.v; haptic(); render(); },
  auto(el) { S.f.auto = el.dataset.v === 'on'; store.set('auto', S.f.auto ? 'on' : 'off'); haptic(); render(); },
  async avatarPick(el) {
    const f = el.files && el.files[0]; if (!f) return;
    const box = $('#avbig'); if (box) box.innerHTML = '<span class="spin"></span>';
    try { S.cfg = await api('avatar_save', { avatar: await squareJpeg(f) }); haptic('medium'); toast('عکس پروفایل ذخیره شد'); }
    catch (e) { fail(e); }
    render(); if (sheetOpen()) $('#sheetBody').innerHTML = accountSheet();
  },
  async avatarDel(el) {
    await busy(el, async () => { S.cfg = await api('avatar_del'); toast('عکس پروفایل حذف شد'); render(); $('#sheetBody').innerHTML = accountSheet(); });
  },
  async create(el) {
    const f = S.f, cat = curCat(); if (!f.file || !cat) return;
    S.busy = true; renderDock();
    try {
      const r = await api('create', { category: f.cat, mode: f.mode, character: f.char, supplier: f.supplier, plating: f.plating, gem: f.gem,
        dims: (cat.dims || []).map(d => ({ n: d.n, v: enNum(f.dims[d.n] || '') })), weight: enNum(f.weight), note: f.note, auto: autoOn() }, [f.file]);
      haptic('heavy');
      S.cfg.me.quota = r.quota || S.cfg.me.quota; S.cfg.supplier = f.supplier;
      Object.assign(S.f, { file: null, url: '', dims: {}, weight: '', note: '', gem: '' }); S.products = null;
      render();
      openSheet(`<div class="sh"><h2>ثبت شد</h2><button class="x0" data-a="close" aria-label="بستن">×</button></div>
        <div class="group"><span class="hint">SKU محصول</span><div class="spread"><span class="sku">${esc(r.sku)}</span><button class="cp" data-a="copy" data-t="${esc(r.sku)}">کپی</button></div>
        <p style="margin:10px 0 0">${esc(r.notice)}</p></div>${canView() ? '<button class="btn dark block" data-a="goProducts">رفتن به محصولات</button>' : ''}`);
    } catch (e) { fail(e); }
    S.busy = false; if (S.tab === 'new') renderDock();
  },
  goProducts() { closeSheet(); S.tab = 'products'; render(); },
  search() { S.products = null; render(); },
  pstatus(el) { S.pstatus = el.dataset.v; S.products = null; render(); },
  product(el) { S.cur = S.products[+el.dataset.i]; openSheet(productSheet(S.cur)); },
  zoom(el) { zoom(el.dataset.u); },
  dl(el) { download(el.dataset.u, el.dataset.n); },
  copy(el) { copy(el.dataset.t); },
  copyall() { copy(S.cur && S.cur.text || ''); },
  async sendtg(el) { await busy(el, async () => { const r = await api('send_tg', { sku: el.dataset.s }); toast(`${faNum(r.sent)} عکس به چت ربات ارسال شد`); }); },
  async regen(el) {
    await busy(el, async () => {
      const r = await api('regen', { sku: el.dataset.s, kind: el.dataset.k, character: val('rg-char') || 'random' });
      S.cfg.me.quota = r.quota || S.cfg.me.quota; toast(r.notice, 4000);
    });
  },
  async psave(el) {
    const sp = S.cur.specs;
    const data = { sku: el.dataset.s, status: $('#pe-pub').checked ? 'published' : 'new' };
    if (sp) { data.dims = [...document.querySelectorAll('.pe-dim')].map(i => ({ n: i.dataset.n, v: enNum(i.value.trim()) })); data.weight = enNum(val('pe-w')); data.note = val('pe-n'); }
    await busy(el, async () => {
      const r = await api('product_save', data);
      const i = S.products.findIndex(x => x.sku === r.product.sku); if (i >= 0) S.products[i] = r.product; S.cur = r.product;
      toast('ذخیره شد'); closeSheet(); render();
    });
  },
  libSeg(el) { S.libSeg = el.dataset.v; render(); },
  catEdit(el) { const i = +el.dataset.i; S.curCat = i >= 0 ? S.lib.categories[i] : null; openSheet(catSheet(S.curCat)); },
  dimAdd() { S.dimsEdit.push({ n: '', u: 'mm', e: '' }); $('#ce-dims').innerHTML = dimsRows(); },
  dimDel(el) { S.dimsEdit.splice(+el.dataset.i, 1); $('#ce-dims').innerHTML = dimsRows(); },
  async catSave(el) {
    const id = el.dataset.id, act = $('#ce-act');
    await busy(el, async () => {
      S.lib = await api('cat_save', { id, fa: val('ce-fa'), en: val('ce-en'), code: val('ce-code').toUpperCase(), dims: S.dimsEdit.filter(d => d.n.trim()), active: act ? act.checked : true });
      toast('دسته ذخیره شد'); await refreshCfg(); closeSheet(); render();
    });
  },
  async catDel(el) {
    if (!await ask('این دسته و همه رفرنس‌هایش حذف شود؟')) return;
    await busy(el, async () => { S.lib = await api('cat_del', { id: el.dataset.id }); await refreshCfg(); closeSheet(); render(); });
  },
  async libAdd(el) {
    const files = [...(el.files || [])]; if (!files.length) return;
    const type = el.dataset.type;
    const label = el.closest('.add'); label.innerHTML = '<span class="spin"></span>';
    try {
      const prepared = await Promise.all(files.map(f => shrink(f)));
      const data = type === 'char' ? { type, charId: S.curModel.id } : { type, category: el.dataset.cat };
      const r = await api('lib_add', data, prepared);
      toast(r.error || `${faNum(r.added)} عکس اضافه شد`);
      await reloadLibSheet();
    } catch (e) { fail(e); await reloadLibSheet(); }
  },
  async libDel(el) {
    if (!await ask('این عکس از کتابخانه حذف شود؟')) return;
    try { S.lib = await api('lib_del', { id: el.dataset.id }); await afterLibChange(); } catch (e) { fail(e); }
  },
  modelEdit(el) { const i = +el.dataset.i; S.curModel = i >= 0 ? S.lib.characters[i] : null; openSheet(modelSheet(S.curModel)); },
  async modelNew(el) {
    const name = val('me-n'); const files = [...(el.files || [])];
    if (!name) { el.value = ''; return toast('اول نام مدل را بنویسید'); }
    if (!files.length) return;
    try {
      const prepared = await Promise.all(files.map(f => shrink(f)));
      const r = await api('lib_add', { type: 'char', charName: name, charDesc: val('me-d') }, prepared);
      toast(r.error || 'مدل ساخته شد'); closeSheet(); S.lib = null; await refreshCfg(); render();
    } catch (e) { fail(e); }
  },
  async modelSave(el) {
    await busy(el, async () => { S.lib = await api('char_save', { charId: el.dataset.id, charName: val('me-n'), charDesc: val('me-d') }); await refreshCfg(); toast('ذخیره شد'); closeSheet(); render(); });
  },
  async modelDel(el) {
    if (!await ask('این مدل و عکس‌های شیتش حذف شود؟')) return;
    await busy(el, async () => { S.lib = await api('char_del', { charId: el.dataset.id }); await refreshCfg(); closeSheet(); render(); });
  },
  optEdit(el) { const k = el.dataset.k, o = S.lib.options[k].find(x => x.code === el.dataset.v); openSheet(optSheet(k, o)); },
  async optSave(el) {
    await busy(el, async () => { S.lib = await api('opt_save', { kind: el.dataset.k, code: val('oe-c').toUpperCase(), name: val('oe-n'), orig: el.dataset.o }); await refreshCfg(); closeSheet(); render(); });
  },
  async optDel(el) {
    if (!await ask('حذف شود؟')) return;
    await busy(el, async () => { S.lib = await api('opt_del', { kind: el.dataset.k, code: el.dataset.o }); await refreshCfg(); closeSheet(); render(); });
  },
  mg(el) { S.mg = el.dataset.v; render(); },
  userEdit(el) { const i = +el.dataset.i; S.curUser = i >= 0 ? S.cfg.users[i] : null; openSheet(userSheet(S.curUser)); },
  genPass() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let p = ''; const r = crypto.getRandomValues(new Uint32Array(10)); r.forEach(n => { p += a[n % a.length]; }); $('#ue-p').value = p; },
  async userSave(el) {
    const u = S.curUser, username = val('ue-u').toLowerCase(), password = val('ue-p');
    const data = { username, display_name: val('ue-d'), password, role: val('ue-r'), active: $('#ue-a').checked, unlink: !!($('#ue-x') && $('#ue-x').checked) };
    await busy(el, async () => {
      const cfg = await api('user_save', data); Object.assign(S.cfg, cfg);
      if (password) await copy(`ورود به استودیو نقرینو\nنام کاربری: ${username}\nرمز: ${password}`); else toast('ذخیره شد');
      closeSheet(); render();
    });
  },
  async userDel(el) {
    if (!await ask('این کاربر حذف شود؟')) return;
    await busy(el, async () => { Object.assign(S.cfg, await api('user_delete', { username: el.dataset.u })); closeSheet(); render(); });
  },
  roleEdit(el) { const i = +el.dataset.i; openSheet(roleSheet(i >= 0 ? S.cfg.roles[i] : null)); },
  async roleSave(el) {
    const perms = {}; document.querySelectorAll('.re-p').forEach(c => { perms[c.dataset.k] = c.checked; });
    const qd = enNum(val('re-d')), qm = enNum(val('re-m'));
    await busy(el, async () => { Object.assign(S.cfg, await api('role_save', { id: el.dataset.id, name: val('re-n'), perms, quota_day: qd === '' ? -1 : qd, quota_month: qm === '' ? -1 : qm })); toast('نقش ذخیره شد'); closeSheet(); render(); });
  },
  async roleDel(el) {
    if (!await ask('این نقش حذف شود؟')) return;
    await busy(el, async () => { Object.assign(S.cfg, await api('role_del', { id: el.dataset.id })); closeSheet(); render(); });
  },
  async aiToggle(el) {
    const k = el.dataset.k, v = el.checked ? 'on' : 'off';
    if (k === 'ai_enabled' && v === 'off' && !await ask('هوش مصنوعی خاموش شود؟ تا روشن شدن دوباره، کارمندان نمی‌توانند عکس بسازند.')) return;
    try { Object.assign(S.cfg, await api('setting_save', { key: k, value: v })); haptic('medium'); toast(v === 'on' ? 'روشن شد' : 'خاموش شد'); } catch (e) { fail(e); }
    render();
  },
  async aiTest(el) {
    await busy(el, async () => {
      const r = await api('ai_test'), box = $('#aiTestOut'); if (!box) return;
      box.innerHTML = r.connected
        ? `<b class="okc">✅ اتصال برقرار است</b> <span class="hint">(${faNum(r.ms)} میلی‌ثانیه · ${faNum(r.models)} مدل در دسترس)</span>${(r.missing || []).length ? `<br><b style="color:var(--warn)">⚠️ این مدل‌ها در لیست سرویس پیدا نشد:</b> <span dir="ltr">${r.missing.map(esc).join('، ')}</span>` : ''}`
        : `<b style="color:var(--err)">❌ ${esc(r.error)}</b>${r.detail ? `<br><small class="hint" dir="ltr">${esc(r.detail)}</small>` : ''}`;
      toast(r.connected ? '✅ اتصال برقرار است' : '❌ اتصال برقرار نشد', 4000);
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  },
  async setSave(el) {
    const k = el.dataset.k, v = val('st-' + k);
    if (k === 'image_api_key' && v.startsWith('••••')) return toast('کلید جدید را وارد کنید');
    await busy(el, async () => { Object.assign(S.cfg, await api('setting_save', { key: k, value: v })); toast('ذخیره شد'); render(); });
  },
  async prSave(el) {
    const k = el.dataset.k;
    await busy(el, async () => { Object.assign(S.cfg, await api('prompt_save', { key: k, prompt: $('#pr-' + k).value })); toast('پرامپت ذخیره شد'); });
  },
  async backup(el) { await busy(el, async () => { const r = await api('backup'); toast(`بکاپ (${faNum(Math.round(r.size / 1024))} کیلوبایت) به چت ربات ارسال شد`, 4000); }); },
  close: closeSheet,
  scrim(el, ev) { if (ev.target === el) closeSheet(); },
};
async function refreshCfg() { try { const c = await api('config'); S.cfg = c; } catch (e) {} }
async function afterLibChange() {
  if (S.curCat) { S.curCat = S.lib.categories.find(c => c.id === S.curCat.id) || null; if (sheetOpen() && S.curCat) $('#sheetBody').innerHTML = catSheet(S.curCat); }
  else if (S.curModel) { S.curModel = S.lib.characters.find(c => c.id === S.curModel.id) || null; if (sheetOpen() && S.curModel) $('#sheetBody').innerHTML = modelSheet(S.curModel); }
  await refreshCfg(); if (!sheetOpen()) render();
}
async function reloadLibSheet() { try { S.lib = await api('library'); } catch (e) {} await afterLibChange(); }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT' && el.type === 'file') return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a !== 'scrim') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.type === 'file' && el.dataset.a && A[el.dataset.a]) A[el.dataset.a](el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target, f = el.dataset && el.dataset.f; if (!f) return;
  if (f === 'dim') { const d = (curCat().dims || [])[+el.dataset.i]; if (d) S.f.dims[d.n] = el.value; }
  else if (f === 'weight' || f === 'note') S.f[f] = el.value;
  else if (f === 'pq') S.pq = el.value;
  else if (f === 'dimE') S.dimsEdit[+el.dataset.i][el.dataset.p] = el.value;
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { const l = $('.light'); if (l) l.remove(); else if (sheetOpen()) closeSheet(); }
  if (ev.key === 'Enter' && ev.target.id === 'lg-p') A.login($('[data-a=login]'));
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.f === 'pq') A.search();
});

(async function boot() {
  if (!inTG) { render(); return; }
  try { S.cfg = await api('config'); } catch (e) { if (!(e instanceof NeedLogin)) { $('#view').innerHTML = `<div class="empty"><strong>اتصال برقرار نشد</strong>${esc(e.message)}</div>`; return; } }
  render();
})();
</script>
</body>
</html>
